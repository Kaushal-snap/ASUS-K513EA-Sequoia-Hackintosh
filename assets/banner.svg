<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
<title id="title">ASUS K513EA Sequoia Hackintosh</title>
<desc id="desc">A colorful gradient banner for the ASUS VivoBook K15 OLED Hackintosh project.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10152f"/><stop offset=".48" stop-color="#263a78"/><stop offset="1" stop-color="#6b2f83"/></linearGradient>
 <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4de2c5"/><stop offset=".52" stop-color="#72a7ff"/><stop offset="1" stop-color="#e28cff"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="42"/></filter>
</defs>
<rect width="1600" height="520" rx="34" fill="url(#bg)"/>
<circle cx="1320" cy="80" r="190" fill="#8a5cff" opacity=".34" filter="url(#blur)"/>
